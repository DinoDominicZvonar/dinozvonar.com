<html>
    <head>
    <script type="text/javascript" src="code.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" onload="this.rel='stylesheet'">
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="stylesheet" href="games/style.css" type="text/css">

    <meta charset="utf-8">
    <meta name="Dino Zvonar">
    <title>Dino Zvonar</title>
    <style type="text/css">
    </style>

    </head>

    <body>
        <header style="text-align: center;">

            <div id="nav"></div>

            <script>
                fetch('../navbar.html')
                .then(response => response.text())
                .then(data => {
                document.getElementById('nav').innerHTML = data;
                
                const homeTab = document.getElementById("HOME");
                if (homeTab) {
                    homeTab.classList.remove("disabled");
                }

                });
            </script>
            
        </header>

        <div class="landingPageHeader">
                <video autoplay muted loop playslinline class="bg-video">
                    <source src="Resources/Videos/DinoZvonarComBackground.webm" type="video/webm">
                </video>
                <h1>Dino Zvonar</h1>
                <h2 class="subtitle" id="adjective">Software Engineer</h2>

                <script type="text/javascript">
                (function () {
                var words = [
                    "Software Engineer",
                   "Game Developer",
                   "Cobol Developer",
                   "Engine Programmer",
                   "Graphics Programmer",
                   "Gameplay Programmer",
                   "C# Developer",
                  "C++ Developer"
                ],
                index = 0;

                const elem = document.getElementById("adjective");

                setInterval(() => {
                 index = (index + 1) % words.length;
                 elem.textContent = words[index];
                }, 1000);
                })();
                </script>
            </div>
        
        <div class="main-content">
            <h3>Projects</h3>
            <div class="MultiDiv">
                    <div>
                        <img src="Resources/Images/Specialization/State Machine.webp" loading="lazy" decoding="async" alt="State Machine">
                    </div>
                    <div>
                        <img src="Resources/Images/Aurora Borealis/Hiearchy+Showcase.gif" loading="lazy" decoding="async" alt="State Machine">
                    </div>
            </div>
            <br>
            <br>
            <br>
            <h3>Featured Games</h3>
            <div class="FeaturedGames">
                <div class="GameCard" id="space-trip">
                    <img src="../Resources/Images/Spacetrip Banner.webp" loading="lazy" decoding="async" style="margin-left: -170px;" alt="Space Trip">

                    <div class="Title">
                        <p><b>Space Trip</b> - 2023</p>
                        <p class="GameInfo"><b>Platforms: </b> PC<br><b>Engine:</b> Unity<br>The Game Assembly</p>
                    </div>
                </div>

                <div class="GameCard">
                    <img src="https://image.api.playstation.com/vulcan/ap/rnd/202507/2514/7262f0bce0e977a4eda78df1a00af04578583c15d8fb1e10.png" style="margin-left: -270px;" alt="Battlefield 6">

                    <div class="Title">
                        <p><b>Battlefield 6</b> - 2025</p>
                        <p class="GameInfo"><b>Platforms: </b> PC, PS5, Xbox Series X/S<br><b>Engine:</b> Frostbite<br>DICE</p>
                    </div>

                </div>

                <div class="GameCard" id="spite-the-summoning">
                    <img src="../Resources/Images/Spite The Summoning.webp" loading="lazy" decoding="async" style="margin-left: -200px; scale: 1.45;" alt="Spite: The Summoning">

                    <div class="Title">
                        <p><b>Spite: The Summoning</b> - 2024</p>
                        <p class="GameInfo"><b>Platforms: </b> PC<br><b>Engine:</b> Aurora <i>(In-House)</i><br>The Game Assembly</p>
                    </div>
                </div>

                <script>
                    document.querySelectorAll(".gamecard").forEach(card => {
                    card.addEventListener("click", function() { window.location.href = "https://dinozvonar.com/games/" + this.id; });
                    });
                </script>

            </div>
            
            
        <div id="foot"></div>

        <script>
                fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                document.getElementById('foot').innerHTML = data;
                });
        </script>

    </div>

    </body>


    
</html>
